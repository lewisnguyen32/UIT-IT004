<text x="70" y="1130" font-size="16" text-anchor="start" >Cặp cạnh thực thể X là số lần một cá thể X tham gia mối kết hợp, theo cách đọc (min,max) trong slide.</text>
<text x="70" y="1159" font-size="16" text-anchor="start" >Giả thiết về min: các phía chỉ nêu “có thể” được lấy là (0,n); mỗi vụ việc có đúng một người tố giác và một nạn nhân chính.</text>
<text x="70" y="1188" font-size="16" text-anchor="start" >Giả thiết về lượt: mỗi cặp vụ việc–điều tra viên có tối đa một lượt; nếu cho lặp, mô hình và khóa cần phân biệt từng lượt.</text>
<text x="70" y="1217" font-size="16" text-anchor="start" >Ở hình ER, NgToGiac và NanNhan được thể hiện bằng mối kết hợp; không lặp lại chúng như các thuộc tính khóa ngoại.</text>
